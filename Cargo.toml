[package]
name = "golden_price"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = "0.4"
fontdue = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde_json = "1"
tiny-skia = "0.11"
windows-sys = { version = "0.59", features = [
	"Win32_Foundation",
	"Win32_Graphics_Gdi",
	"Win32_System_LibraryLoader",
	"Win32_UI_HiDpi",
	"Win32_UI_Controls",
	"Win32_UI_Input_KeyboardAndMouse",
	"Win32_UI_Shell",
	"Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
